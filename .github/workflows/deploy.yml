name: Build → Push → Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/shelter-web
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/shelter-admin

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # нужно для push в GHCR

    outputs:
      web_tag:   ${{ steps.meta-web.outputs.version }}
      admin_tag: ${{ steps.meta-admin.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # ── Web (Expo) ───────────────────────────────────────────
      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mobile/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
            EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.WEB_IMAGE }}:cache,mode=max

      # ── Admin (Next.js) ──────────────────────────────────────
      - name: Extract metadata (admin)
        id: meta-admin
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.ADMIN_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=registry,ref=${{ env.ADMIN_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.ADMIN_IMAGE }}:cache,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.SSH_HOST }}
          port:        ${{ secrets.SSH_PORT }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Отримати свіжий код (тільки docker-compose файли і міграції)
            git pull origin main

            # Авторизація в GHCR (щоб тягнути образи)
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # Потягнути нові образи та перезапустити
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull web admin

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build

            # Застосувати нові міграції (якщо є)
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d migrator

            docker image prune -f --filter "until=24h"
            echo "✅ Deployed at $(date)"
