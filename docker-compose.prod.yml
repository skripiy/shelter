# ================================================================
# SHELTER ACCORD — Production Overrides
#
# Використання:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Що змінює відносно базового файлу:
#   • Додає зовнішній nginx з SSL (Let's Encrypt / Certbot)
#   • Не відкриває жодних портів крім 8090 (HTTP) та 8453 (HTTPS)
#   • Замінює build → готові образи з GHCR (GitHub Actions будує)
#   • Вимикає Supabase Studio (безпека)
#   • Встановлює restart: always
#
# Порти 8090/8453 (не стандартні 80/443) — сервер за NAT/PAT,
# 80 і 443 зайняті іншими сервісами на хості.
# ================================================================

services:

  # ── Зовнішній Nginx (SSL termination) ─────────────────────────
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: shelter-nginx-proxy
    restart: always
    ports:
      - "8090:80"      # NAT: external :8090 → host :8090 → nginx :80
      - "8453:443"     # NAT: external :8453 → host :8453 → nginx :443
    environment:
      DOMAIN: ${DOMAIN:-shelter.basecorp.net}
    volumes:
      # .template → nginx підхоплює автоматично, запускає envsubst і кладе у conf.d/
      - ./docker/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - kong
    networks:
      - default

  # ── Certbot (Let's Encrypt) ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: shelter-certbot
    restart: "no"
    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
    # Оновлення сертифікату:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot renew
    command: "--version"

  # ── Заміна build → готові образи з GHCR ──────────────────────
  # GitHub Actions будує і пушить; сервер тільки пулить.
  # Запуск оновлення: docker compose ... pull web admin && up -d
  # image: override замінює тег; --no-build у CI гарантує що build не запускається.
  # Якщо запускати без --no-build — docker використає локальний build (dev fallback).
  web:
    image: ghcr.io/skripiy/shelter-web:latest
    restart: always

  admin:
    image: ghcr.io/skripiy/shelter-admin:latest
    restart: always

  # ── Встановлюємо restart: always для всіх сервісів ───────────
  db:
    restart: always

  auth:
    restart: always

  rest:
    restart: always

  realtime:
    restart: always

  storage:
    restart: always

  imgproxy:
    restart: always

  meta:
    restart: always

  kong:
    restart: always

  # ── Вимикаємо Studio (не для публічного продакшну) ────────────
  studio:
    profiles:
      - dev-only     # не запускається без --profile dev-only
