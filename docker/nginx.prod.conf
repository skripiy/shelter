# ================================================================
# SHELTER ACCORD — Production Nginx
# Замінює docker/nginx.prod.conf
#
# Маршрутизація:
#   /           → web (Expo SPA) :3000
#   /supabase/* → kong (Supabase API) :8000
#   /admin/*    → admin panel :3001
#
# SSL: Let's Encrypt через Certbot.
# Перед першим запуском запустіть certbot (див. docker-compose.prod.yml).
# ================================================================

# ──────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────
# HTTPS main
# ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    # SSL certificates (генеруються Certbot)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (після перевірки що сайт повністю на HTTPS)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker internal DNS — резолвить upstream'и при кожному запиті,
    # а не при старті nginx. Завдяки цьому nginx стартує навіть якщо
    # shelter-admin або shelter-web ще не підняті.
    resolver 127.0.0.11 valid=10s;

    # ── Supabase API (/supabase/*) ─────────────────────────────
    location /supabase/ {
        set $upstream_kong http://shelter-kong:8000;
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass         $upstream_kong;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # ── Admin panel (/admin/*) ─────────────────────────────────
    location /admin/ {
        set $upstream_admin http://shelter-admin:3000;
        proxy_pass         $upstream_admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Web SPA (всі інші запити) ──────────────────────────────
    location / {
        set $upstream_web http://shelter-web:80;
        proxy_pass         $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
