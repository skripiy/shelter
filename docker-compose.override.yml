# ================================================================
# SHELTER ACCORD — Local Dev Overrides
#
# Цей файл підхоплюється автоматично тільки при:
#   docker compose up           (без -f флагів)
#
# У продакшні використовується docker-compose.prod.yml, який НЕ
# підхоплює цей файл автоматично — тому тут безпечно зберігати
# dev-специфічні порти.
# ================================================================

services:

  # Відкриваємо порти назовні тільки для локального dev
  db:
    ports:
      - "5432:5432"    # TablePlus / pgAdmin / psql

  kong:
    ports:
      - "8000:8000"    # Supabase API (пряме підключення)
      - "8443:8443"    # Supabase API (HTTPS)

  studio:
    ports:
      - "3333:3000"    # Supabase Studio UI

  admin:
    ports:
      - "3001:3000"    # Admin panel

  web:
    ports:
      - "3000:80"      # Expo web app
