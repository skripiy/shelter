<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#080f1e"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid lines (depth effect) -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/>

  <!-- Inner wall fill (arch interior background) -->
  <path d="M 128 460 L 128 248 C 128 100 384 100 384 248 L 384 460 Z"
        fill="url(#innerGlow)"/>

  <!-- Arch thick walls (dark fill + blue outline) -->
  <!-- Left wall -->
  <rect x="108" y="244" width="56" height="216" rx="4" fill="#0d1929"/>
  <rect x="108" y="244" width="56" height="216" rx="4" fill="none" stroke="#3b82f6" stroke-width="5"/>
  <!-- Right wall -->
  <rect x="348" y="244" width="56" height="216" rx="4" fill="#0d1929"/>
  <rect x="348" y="244" width="56" height="216" rx="4" fill="none" stroke="#3b82f6" stroke-width="5"/>

  <!-- Arch curved top (cubic bezier from wall-top to wall-top through peak) -->
  <!-- Path: from left wall top, curve up and over to right wall top -->
  <path d="M 108 260 C 108 72 404 72 404 260"
        fill="#0d1929" stroke="#3b82f6" stroke-width="5"/>

  <!-- Blue outline glow on arch (softer second stroke) -->
  <path d="M 108 260 C 108 72 404 72 404 260"
        fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.18" filter="url(#glow)"/>

  <!-- Floor bar -->
  <rect x="84" y="456" width="344" height="16" rx="8" fill="#3b82f6" opacity="0.65"/>
  <!-- Floor glow -->
  <rect x="84" y="456" width="344" height="16" rx="8" fill="#93c5fd" opacity="0.2"/>

  <!-- Door opening -->
  <rect x="204" y="338" width="104" height="118" rx="12" fill="#050b17"/>
  <rect x="204" y="338" width="104" height="118" rx="12" fill="none" stroke="#3b82f6" stroke-width="5"/>
  <!-- Door interior glow -->
  <rect x="212" y="346" width="88" height="102" rx="8" fill="url(#doorGlow)"/>
  <!-- Door handle -->
  <circle cx="294" cy="403" r="9" fill="#3b82f6" opacity="0.9"/>

  <!-- Porthole window -->
  <circle cx="256" cy="206" r="52" fill="#080f1e" stroke="#3b82f6" stroke-width="6"/>
  <!-- Inner ring -->
  <circle cx="256" cy="206" r="36" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.55"/>
  <!-- Glass fill -->
  <circle cx="256" cy="206" r="33" fill="#112240" opacity="0.8"/>
  <!-- Center dot -->
  <circle cx="256" cy="206" r="11" fill="#3b82f6"/>
  <circle cx="256" cy="206" r="5" fill="#93c5fd"/>
  <!-- Cross hair lines -->
  <line x1="256" y1="154" x2="256" y2="258" stroke="#60a5fa" stroke-width="2.5" opacity="0.45"/>
  <line x1="204" y1="206" x2="308" y2="206" stroke="#60a5fa" stroke-width="2.5" opacity="0.45"/>

  <!-- Wall rivets (bolts) -->
  <circle cx="130" cy="292" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="130" cy="340" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="130" cy="388" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="382" cy="292" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="382" cy="340" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="382" cy="388" r="6" fill="#3b82f6" opacity="0.7"/>

  <!-- Caution stripes on floor -->
  <rect x="84" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="124" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="164" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="300" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="340" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="380" y="468" width="28" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>
</svg>
